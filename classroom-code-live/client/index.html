<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classroom Code Live — Aluno</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<script src="/js/theme-init.js" data-theme-key="ccl-theme"></script>
<style>
    html, body { height: 100%; }
    #appShell:not(.hidden) { display: flex; flex-direction: column; height: 100%; }
    #mainArea { display: flex; flex: 1 1 auto; min-width: 0; min-height: 0; }
    #activityBar { width: 48px; flex: 0 0 48px; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; border-right: 1px solid var(--studio-line, #293b3d); background: var(--studio-surface, #111d20); }
    .activity-btn { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--studio-muted, #90a5a2); background: transparent; border: none; cursor: pointer; transition: background .15s, color .15s; }
    .activity-btn:hover, .activity-btn.active { background: var(--studio-raised, #18272a); color: var(--studio-mint, #79e0bd); }
    .activity-btn:focus-visible { outline: 2px solid var(--studio-mint, #79e0bd); outline-offset: 2px; }
    .activity-btn svg { width: 20px; height: 20px; }
    .activity-btn .badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--studio-coral, #ff9a77); color: var(--studio-ink, #0b1214); font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
    #editorWorkspace { display: flex; flex: 1 1 auto; flex-direction: row; min-width: 0; min-height: 0; }
    #editor { flex: 1 1 0; min-width: 120px; min-height: 120px; }
    #consolePanel { width: var(--console-width, 34%); flex: 0 0 var(--console-width, 34%); min-width: 220px; min-height: 120px; }
    .resize-handle {
      position: relative;
      z-index: 2;
      flex: 0 0 10px;
      cursor: col-resize;
      touch-action: none;
      display: grid;
      place-items: center;
      color: var(--studio-muted, #64748b);
      background: transparent;
    }
    .resize-handle::after {
      content: "";
      width: 3px;
      height: 44px;
      border-radius: 999px;
      background: currentColor;
      opacity: .55;
      transition: width .15s ease, opacity .15s ease, background-color .15s ease;
    }
    .resize-handle:hover::after, .resize-handle:focus-visible::after, .resize-handle.is-resizing::after {
      height: 64px;
      opacity: 1;
      background: var(--studio-mint, #8b5cf6);
    }
    .resize-handle:focus-visible { outline: 2px solid var(--studio-mint, #8b5cf6); outline-offset: -2px; }
    #output, #runLabel { font-family: var(--code-font-family, "JetBrains Mono"), ui-monospace, Consolas, monospace; }
    #output { min-height: 0; }
    #terminal-container { width: 100%; height: 100%; }
    #terminal-container .xterm { height: 100%; padding: 4px 8px; }
    #terminal-container .xterm-viewport { scrollbar-color: #1b4e85 #012456; scrollbar-width: thin; }
    #terminal-container .xterm-viewport::-webkit-scrollbar { width: 8px; }
    #terminal-container .xterm-viewport::-webkit-scrollbar-track { background: #012456; }
    #terminal-container .xterm-viewport::-webkit-scrollbar-thumb { background: #1b4e85; }
    #consolePanel { background: #0f172a; border-color: #1e293b; }
    #consolePanel > div { border-color: #1e293b; }
    #output { color: #cbd5e1; }
    #runLabel { color: #94a3b8; }
    body.light #consolePanel { background: #fff; border-color: #e2e8f0; }
    body.light #consolePanel > div { border-color: #e2e8f0; }
    body.light #consolePanel .font-semibold { color: #0f172a !important; }
    body.light #consolePanel .text-slate-600, body.light #runLabel { color: #64748b !important; }
    body.light #output { color: #0f172a !important; }
    body.light #output .text-red-400 { color: #dc2626 !important; }
    body.light #output .text-slate-600 { color: #94a3b8 !important; }
    @media (max-width: 760px) {
      #mainArea { flex-direction: column; }
      #activityBar { width: 100%; height: 48px; flex-direction: row; flex: 0 0 48px; border-right: none; border-bottom: 1px solid var(--studio-line, #293b3d); padding: 0 8px; justify-content: flex-start; gap: 2px; }
      #editorWorkspace { flex-direction: column; }
      #editor { flex: 1 1 auto; width: 100%; min-width: 0; }
      #consolePanel { width: 100%; flex: 0 0 var(--console-height, 12rem); height: var(--console-height, 12rem); min-width: 0; }
      .resize-handle { flex-basis: 10px; cursor: row-resize; }
      .resize-handle::after { width: 44px; height: 3px; }
      .resize-handle:hover::after, .resize-handle:focus-visible::after, .resize-handle.is-resizing::after { width: 64px; height: 3px; }
    }
  #studentTasksPanel:not(.hidden) {
    position: fixed;
    z-index: 30;
    top: var(--student-tasks-top, 8rem);
    left: 50%;
    display: block;
    width: min(56rem, calc(100vw - 2rem));
    max-height: min(60vh, 34rem);
    transform: translateX(-50%);
    overflow: auto;
    border: 1px solid #334155;
    border-radius: 1rem;
    background: #0f172a;
    box-shadow: 0 24px 70px rgba(2, 6, 23, .55);
  }
  #studentTasksPanel:not(.hidden) > div { padding: 1rem; }
  #studentTasksPanel:not(.hidden) h2 { font-size: .95rem; }
  #studentTasksPanel:not(.hidden) .student-tasks-header {
    position: sticky;
    z-index: 1;
    top: -1rem;
    margin: -1rem -1rem .75rem;
    padding: .85rem 1rem;
    border-bottom: 1px solid rgba(148, 163, 184, .14);
    background: #0f172a;
  }
  #studentTasksPanel:not(.hidden) #studentTaskList {
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr));
  }
  #studentTasksPanel:not(.hidden) .student-task-card {
    border-color: rgba(148, 163, 184, .2);
    background: linear-gradient(145deg, rgba(30, 41, 59, .72), rgba(2, 6, 23, .62));
    padding: 1rem;
    box-shadow: inset 0 1px rgba(255, 255, 255, .025);
  }
  #studentTasksPanel:not(.hidden) .student-task-card .task-description { line-height: 1.55; }
  #studentTasksPanel:not(.hidden) .student-task-card button { min-height: 2.25rem; }
  #studentTasksPanel:not(.hidden) #studentTaskStatus:not(:empty) {
    border-radius: 999px;
    background: rgba(16, 185, 129, .08);
    padding: .25rem .6rem;
    color: #6ee7b7;
  }
  #studentTasksPanel:not(.hidden) #studentTaskList > p { grid-column: 1 / -1; }
  #studentTasksBackdrop:not(.hidden) { display: block; }
  body.light #studentTasksBackdrop { background: rgba(15, 23, 42, .24); }
  body.light #studentTasksPanel:not(.hidden) { border-color: #cbd5e1; box-shadow: 0 24px 70px rgba(15, 23, 42, .2); }
  body.light #studentTasksPanel:not(.hidden) .student-tasks-header { background: #fff; border-color: #e2e8f0; }
  body.light #studentTasksPanel:not(.hidden) .student-task-card { background: #f8fafc; border-color: #dbe3ef; }
  body.light #studentTasksPanel:not(.hidden) #studentTaskStatus:not(:empty) { background: #ecfdf5; color: #047857; }
  @media (max-width: 640px) {
    #studentTasksPanel:not(.hidden) {
      top: var(--student-tasks-top, 8rem);
      width: calc(100vw - 1rem);
      max-height: calc(100dvh - var(--student-tasks-top, 8rem) - .75rem);
    }
    #studentTasksPanel:not(.hidden) > div { padding: .75rem; }
    #studentTasksPanel:not(.hidden) .student-tasks-header {
      top: -.75rem;
      margin: -.75rem -.75rem .65rem;
      padding: .7rem .75rem;
    }
    #studentTasksPanel:not(.hidden) #studentTaskList { grid-template-columns: minmax(0, 1fr); }
    #toolbar { gap: .4rem; padding: .55rem .65rem; }
    #toolbar #nameInput { flex: 1 1 8rem; width: auto; }
  }
  /* Evita flash escuro para quem gravou o tema claro */
  html[data-theme="light"] body { background: #f8fafc; color: #0f172a; }
  /* Tema claro: overrides sobre as classes dark do Tailwind */
  body.light { background-color: #f8fafc !important; color: #0f172a !important; }
  body.light header { background-color: #ffffff !important; border-color: #e2e8f0 !important; }
  body.light header h1 { color: #0f172a !important; }
  body.light header p, body.light header .text-slate-400 { color: #64748b !important; }
  body.light #toolbar { background-color: #f1f5f9 !important; border-color: #e2e8f0 !important; }
  body.light #toolbar input, body.light #toolbar select { background-color: #ffffff !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
  body.light #toolbar .text-slate-500 { color: #64748b !important; }
  body.light #studentTasksPanel { background-color: #ffffff !important; border-color: #e2e8f0 !important; }
  body.light .student-task-card { background-color: #f8fafc !important; border-color: #e2e8f0 !important; }
  body.light .student-task-card .task-description { color: #475569 !important; }
  body.light #editor { border-top: 1px solid #e2e8f0; }
  body.light .resize-handle { color: #94a3b8; }
  body.light footer { background-color: #ffffff !important; border-color: #e2e8f0 !important; color: #64748b !important; }
  /* Menu Definições */
  .menu-item { display: block; width: 100%; text-align: left; font-size: 13px; padding: 6px 8px; border-radius: 6px; color: #e2e8f0; }
  .menu-item:hover { background-color: #1e293b; }
  .menu-label { font-size: 11px; font-weight: 600; color: #94a3b8; letter-spacing: .04em; }
  body.light #settingsMenu { background-color: #ffffff !important; border-color: #cbd5e1 !important; }
  body.light #settingsMenu input, body.light #settingsMenu select { background-color: #f8fafc !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
  body.light #settingsMenu hr { border-color: #e2e8f0 !important; }
  body.light .menu-item { color: #0f172a; }
  body.light .menu-item:hover { background-color: #f1f5f9; }
  body.light .menu-label { color: #64748b; }
  #loginView {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(16, 185, 129, .12), transparent 48%),
      #020617;
  }
  .login-card { box-shadow: 0 24px 80px rgba(0, 0, 0, .35); }
  body.light #loginView {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(16, 185, 129, .12), transparent 48%),
      #f1f5f9;
  }
  body.light .login-card { background: #fff !important; border-color: #e2e8f0 !important; }
  body.light .login-card label { color: #334155 !important; }
  body.light .login-card .login-subtitle { color: #64748b !important; }
  body.light .login-card input { background: #f8fafc !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
  body.light #studentProgressBtn { color: #334155 !important; border-color: #cbd5e1 !important; }

  :root {
    --studio-ink: #0b1214;
    --studio-surface: #111d20;
    --studio-raised: #18272a;
    --studio-line: #293b3d;
    --studio-mint: #79e0bd;
    --studio-coral: #ff9a77;
    --studio-lime: #d8f274;
    --studio-text: #eaf2ee;
    --studio-muted: #90a5a2;
    --studio-display: "Space Grotesk", sans-serif;
  }
  body:not(.light) {
    color: var(--studio-text) !important;
    background-color: var(--studio-ink) !important;
    background-image: linear-gradient(rgba(121, 224, 189, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(121, 224, 189, .035) 1px, transparent 1px);
    background-size: 32px 32px;
    font-family: var(--studio-display);
  }
  body:not(.light) #loginView { background: transparent; }
  body:not(.light) .login-card {
    position: relative;
    overflow: hidden;
    border-color: var(--studio-line) !important;
    border-radius: 1rem;
    background: rgba(17, 29, 32, .97) !important;
    box-shadow: 0 28px 90px rgba(0, 0, 0, .38), 0 1px rgba(255, 255, 255, .04) inset;
  }
  body:not(.light) .login-card::before {
    position: absolute;
    inset: 0 0 auto;
    height: 3px;
    background: linear-gradient(90deg, var(--studio-mint) 0 62%, var(--studio-coral) 62% 100%);
    content: "";
  }
  body:not(.light) .login-card h1 { font-family: var(--studio-display); font-size: 1.75rem; letter-spacing: 0; }
  body:not(.light) .login-card .text-emerald-400 { color: var(--studio-mint) !important; }
  body:not(.light) .login-card > div:first-child > div:first-child {
    border-radius: .75rem;
    background: var(--studio-lime) !important;
    box-shadow: 0 8px 24px rgba(216, 242, 116, .12);
  }
  body:not(.light) #appShell > header {
    border-color: var(--studio-line) !important;
    background: rgba(11, 18, 20, .94) !important;
    box-shadow: 0 1px rgba(255, 255, 255, .035);
    backdrop-filter: blur(16px);
  }
  body:not(.light) #appShell > header > div:first-child {
    border-radius: .7rem;
    background: var(--studio-lime) !important;
    color: var(--studio-ink) !important;
  }
  body:not(.light) #toolbar {
    border-color: var(--studio-line) !important;
    background: rgba(17, 29, 32, .94) !important;
  }
  body:not(.light) #toolbar input,
  body:not(.light) #toolbar select,
  body:not(.light) #settingsMenu {
    border-color: var(--studio-line) !important;
    background-color: var(--studio-raised) !important;
  }
  body:not(.light) #runBtn {
    border: 1px solid rgba(216, 242, 116, .25);
    background: var(--studio-lime) !important;
    color: #172018 !important;
    box-shadow: 0 4px 18px rgba(216, 242, 116, .09);
  }
  body:not(.light) #runBtn:hover { background: #e5fa96 !important; }
  body:not(.light) #studentTasksToggle {
    border-color: rgba(255, 154, 119, .35) !important;
    background: rgba(255, 154, 119, .1) !important;
    color: #ffc0a9 !important;
  }
  body:not(.light) #studentTasksToggle span { background: rgba(255, 154, 119, .18) !important; }
  body:not(.light) #consolePanel {
    border-color: var(--studio-line) !important;
    background: #012456 !important;
  }
  body:not(.light) #consolePanel > div { border-color: #1b4e85 !important; }
  body:not(.light) #consolePanel > div:first-child {
    background: #003a70;
    color: #dceeff;
  }
  body:not(.light) #consolePanel .font-semibold { color: #ffffff !important; }
  body:not(.light) #consolePanel > div:first-child > span:last-child { color: #a9c9e8 !important; }
  body:not(.light) #output { color: #f2f2f2; }
  body:not(.light) #consolePanel #runLabel { color: #a9c9e8 !important; }
  body:not(.light) .resize-handle { color: var(--studio-mint); }
  body:not(.light) #studentTasksPanel:not(.hidden) {
    border-color: var(--studio-line);
    border-radius: .8rem;
    background: var(--studio-surface);
  }
  body:not(.light) #studentTasksPanel:not(.hidden) .student-tasks-header { background: var(--studio-surface); }
  body:not(.light) #studentTasksPanel:not(.hidden) .student-task-card {
    border-color: var(--studio-line);
    border-radius: .65rem;
    background: #162326;
  }
  body:not(.light) button:focus-visible,
  body:not(.light) input:focus-visible,
  body:not(.light) select:focus-visible { outline-color: var(--studio-mint); }
</style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen">

  <main id="loginView" class="flex min-h-screen flex-1 items-center justify-center overflow-auto px-4 py-8">
    <section class="login-card w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/95 p-6 sm:p-8">
      <div class="mb-6 flex items-center gap-3">
        <div class="grid h-12 w-12 place-items-center rounded-2xl bg-emerald-500 text-lg font-bold text-slate-950">&lt;/&gt;</div>
        <div>
          <p class="text-xs font-semibold uppercase tracking-[.14em] text-emerald-400">Classroom Code Live</p>
          <h1 class="mt-1 text-xl font-bold">Registar aluno</h1>
        </div>
      </div>
      <p class="login-subtitle mb-6 text-sm leading-relaxed text-slate-400">O teu registo fica associado a uma turma neste dispositivo.</p>
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="loginName" class="mb-1.5 block text-sm font-medium text-slate-300">Nome do aluno</label>
          <input id="loginName" name="name" required maxlength="40" autocomplete="name" placeholder="Ex.: Ana Silva" class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2.5 text-sm outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20" />
        </div>
        <div>
          <label for="loginRoom" class="mb-1.5 block text-sm font-medium text-slate-300">Turma</label>
          <select id="loginRoom" name="room" required class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2.5 text-sm outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20">
            <option value="">A carregar turmas...</option>
          </select>
        </div>
        <p id="loginFeedback" class="min-h-5 text-xs text-amber-300" role="status" aria-live="polite"></p>
        <button type="submit" class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400">Registar e começar</button>
      </form>
    </section>
  </main>

  <div id="appShell" class="hidden min-h-0 flex-1 flex-col">
  <!-- Topbar -->
  <header class="flex items-center gap-3 px-4 py-3 border-b border-slate-800 bg-slate-900">
    <div class="w-8 h-8 rounded-lg bg-emerald-500 grid place-items-center font-bold text-slate-950">&lt;/&gt;</div>
    <div class="flex-1">
      <h1 class="font-semibold leading-tight">Classroom Code Live <span class="text-slate-400 font-normal">— Aluno</span></h1>
      <p class="text-xs text-slate-400">Sala: <span id="roomLabel" class="text-emerald-400 font-mono">room_12A</span></p>
    </div>
    <span id="pyStatus" class="text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700" title="Pyodide carrega em fundo para o 1º Run ser rápido">py: a carregar...</span>
    <span id="statusDot" class="text-xs px-2 py-1 rounded-full bg-red-500/15 text-red-300 border border-red-500/30">● a ligar...</span>
  </header>

  <!-- Toolbar -->
  <div id="toolbar" class="flex flex-wrap items-center gap-2 px-4 py-2 bg-slate-900/60 border-b border-slate-800">
    <input id="nameInput" value="" aria-label="Nome do aluno" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm w-44 outline-none focus:border-emerald-500" />
    <select id="langSelect" title="Linguagem" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm outline-none">
      <option value="python">Python</option>
    </select>
    <button id="runBtn" class="bg-emerald-600 hover:bg-emerald-500 rounded px-4 py-1 text-sm font-bold">▶ Executar <span class="font-normal opacity-70">(Ctrl+Enter)</span></button>
    <div class="relative">
      <button id="settingsBtn" title="Definições" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded px-3 py-1 text-sm font-bold">⋯</button>
      <input type="hidden" id="roomInput" value="room_12A" />
      <div id="settingsMenu" class="hidden absolute right-0 mt-1 w-64 rounded-lg border border-slate-700 bg-slate-900 shadow-xl p-3 z-50 space-y-2">
        <p class="menu-label">TEMA</p>
        <select id="themeSelect" title="Tema da página e do editor" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm outline-none">
          <option value="dark">Escuro</option>
          <option value="light">Claro</option>
        </select>
        <label for="fontSelect" class="menu-label block">FONTE DO CÓDIGO</label>
        <select id="fontSelect" title="Fonte do editor e da consola" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm outline-none">
          <option value="jetbrains">JetBrains Mono</option>
          <option value="fira">Fira Code</option>
          <option value="ibm">IBM Plex Mono</option>
        </select>
        <hr class="border-slate-700" />
        <button id="uploadBtn" title="Carregar um ficheiro de código do computador para o editor" class="menu-item">Upload de código…</button>
        <button id="dlBtn" title="Descarrega o código como ficheiro para o computador" class="menu-item">Descarregar código</button>
        <button id="newBtn" title="Descarrega opcionalmente uma cópia e começa com o editor vazio" class="menu-item">Novo (editor vazio)</button>
        <button id="clearBtn" class="menu-item">Limpar consola</button>
      </div>
    </div>
    <input type="file" id="uploadInput" accept=".py,.txt" class="hidden" />
    <span id="runTime" class="text-xs text-slate-500 font-mono"></span>
    <button id="studentProgressBtn" type="button" class="rounded border border-slate-700 px-2.5 py-1 text-xs text-slate-300 hover:bg-slate-800" aria-pressed="false">Preciso de ajuda</button>
    <button id="studentTasksToggle" type="button" class="ml-auto rounded border border-violet-500/40 bg-violet-500/10 px-3 py-1 text-sm font-medium text-violet-200 hover:bg-violet-500/20" aria-expanded="false" aria-controls="studentTasksPanel">Tarefas <span id="studentTaskCount" class="ml-1 rounded-full bg-violet-500/20 px-1.5 text-xs">0</span></button>
  </div>

  <button id="studentTasksBackdrop" type="button" class="hidden fixed inset-0 z-20 bg-slate-950/55 backdrop-blur-[1px]" aria-label="Fechar tarefas"></button>
  <section id="studentTasksPanel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="studentTasksHeading" tabindex="-1">
    <div class="mx-auto max-w-5xl">
      <div class="student-tasks-header mb-2 flex items-center gap-2">
        <h2 id="studentTasksHeading" class="text-sm font-semibold">Tarefas da turma</h2>
        <span id="studentTaskStatus" role="status" aria-live="polite" class="ml-auto max-w-[55%] truncate text-xs text-slate-500"></span>
        <button id="studentTasksClose" type="button" class="rounded px-2 py-1 text-xs text-slate-400 hover:bg-slate-800" aria-label="Fechar tarefas">Fechar</button>
      </div>
      <div id="studentTaskList" class="grid gap-3"></div>
    </div>
  </section>

  <!-- Aviso de turma congelada -->
  <div id="freezeBanner" class="hidden px-4 py-1.5 text-xs font-semibold text-center bg-red-600 text-white">Turma congelada pela professora</div>

  <div id="mainArea">
    <aside id="activityBar" aria-label="Barra de atividades">
      <button type="button" class="activity-btn" title="Abrir ficheiro de código" aria-label="Abrir ficheiro de código" data-panel="files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button type="button" class="activity-btn" title="Buscar no código (Ctrl+F)" aria-label="Buscar no código" data-panel="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </aside>
    <div id="editorWorkspace">
    <!-- Editor -->
    <div id="editor"></div>

    <div id="editorConsoleResize" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="Redimensionar editor e consola" aria-controls="editor consolePanel" aria-valuemin="220" aria-valuenow="34" tabindex="0" title="Arrasta para ajustar a largura do editor e da consola"></div>

    <!-- Consola / Preview : execução 100% local = rápido -->
    <section id="consolePanel" class="shrink-0 border-l border-slate-800 bg-slate-900 flex flex-col">
      <div class="flex items-center gap-2 px-4 py-1.5 text-xs border-b border-slate-800">
        <span class="font-semibold text-slate-300">Terminal</span>
        <span id="runLabel" class="text-slate-500 font-mono"></span>
        <span class="ml-auto text-slate-600">Python via Pyodide • corre no browser</span>
      </div>
      <div id="output" class="flex-1 min-h-0 overflow-hidden px-2 py-2">
        <div id="terminal-container"></div>
      </div>
      <iframe id="preview" class="flex-1 w-full bg-white hidden" sandbox="allow-scripts" title="preview"></iframe>
    </section>
  </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script src="/js/student.js"></script>
</body>
