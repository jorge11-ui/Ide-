<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Acesso da professora — Classroom Code Live</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #020617; color: #e2e8f0; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; }
    main { width: min(100%, 26rem); padding: 2rem; border: 1px solid #334155; border-radius: 1rem; background: #0f172a; box-shadow: 0 24px 80px #0008; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { color: #7b8593; line-height: 1.5; }
    label { display: block; margin: 1.5rem 0 .5rem; font-size: .9rem; font-weight: 600; }
    input, button { width: 100%; border-radius: .6rem; font: inherit; }
    input { padding: .75rem; border: 1px solid #475569; background: #020617; color: #f8fafc; }
    button { margin-top: 1rem; padding: .75rem; border: 0; background: #7c3aed; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    #message { min-height: 1.5rem; margin: .75rem 0 0; color: #fbbf24; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Acesso da professora</h1>
    <p id="description">A verificar a configuração do servidor…</p>
    <form id="teacherLogin">
      <label id="passwordLabel" for="password">Palavra-passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus disabled>
      <p id="message" role="status" aria-live="polite"></p>
      <button type="submit" disabled>Entrar no painel</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('teacherLogin');
    const password = document.getElementById('password');
    const message = document.getElementById('message');
    const button = form.querySelector('button');
    let setupRequired = false;
    fetch('/teacher-auth-status', { cache: 'no-store' })
      .then(async response => {
        if (!response.ok) throw new Error('status');
        const status = await response.json();
        setupRequired = status.setupRequired === true;
        if (setupRequired) {
          document.getElementById('heading').textContent = 'Configurar acesso da professora';
          document.getElementById('description').textContent = 'És a primeira pessoa a configurar este painel. Cria uma palavra-passe com pelo menos 12 caracteres. O acesso fica guardado neste servidor.';
          document.getElementById('passwordLabel').textContent = 'Criar palavra-passe';
          password.autocomplete = 'new-password';
          password.minLength = 12;
          button.textContent = 'Configurar e entrar';
        }
        password.disabled = false;
        button.disabled = false;
      })
      .catch(() => { message.textContent = 'Não foi possível verificar a configuração do servidor.'; });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = setupRequired ? 'A guardar a configuração…' : 'A verificar…';
      try {
        const response = await fetch('/teacher-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password.value })
        });
        const result = await response.json();
        if (!response.ok) {
          message.textContent = result.message || 'Não foi possível iniciar sessão.';
          if (response.status === 409) location.reload();
          return;
        }
        location.reload();
      } catch (error) {
        message.textContent = 'Não foi possível contactar o servidor.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
